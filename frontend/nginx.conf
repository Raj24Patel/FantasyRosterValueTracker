server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # forward API calls to the Spring Boot container
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Angular SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
