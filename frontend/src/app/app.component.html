<!-- thin animated bar at the very top while any HTTP request is in flight -->
<div class="loading-bar" [class.active]="loading.loading()"></div>

<header class="topbar">
  <a routerLink="/leagues" class="brand">🏈 Dynasty Roster Value Tracker</a>
</header>

<main class="container">
  <router-outlet />
</main>

<!-- toasts: red for failures, green for confirmed actions; click to dismiss -->
<div class="toasts">
  @for (toast of toasts.toasts(); track toast.id) {
    <div class="toast" [class]="'toast ' + toast.kind" (click)="toasts.dismiss(toast.id)">
      {{ toast.message }}
    </div>
  }
</div>
