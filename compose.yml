services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dynasty
      POSTGRES_PASSWORD: dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # published so `mvn spring-boot:run` on the host can reach it; override
      # with DB_PORT if you already have Postgres on 5432
      - "${DB_PORT:-5432}:5432"

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/dynasty
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: dev
      # cap on how many leagues this instance will track (no accounts, so
      # anyone with the URL can add them)
      MAX_LEAGUES: ${MAX_LEAGUES:-25}
    ports:
      # override when 8080 is taken locally: API_PORT=8081 docker compose up
      - "${API_PORT:-8080}:8080"

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-4200}:80"
    depends_on:
      - api

volumes:
  pgdata:
