name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Backend tests (unit, slice, Testcontainers)
        run: mvn -B verify
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack with a stubbed Sleeper
        run: docker compose -f compose.yml -f compose.e2e.yml up -d --build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Wait for the API and UI
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8080/actuator/health
          curl -sf http://localhost:4200 > /dev/null
      - run: npx playwright test
        working-directory: frontend
      - name: Dump API logs on failure
        if: failure()
        run: docker compose -f compose.yml -f compose.e2e.yml logs api
